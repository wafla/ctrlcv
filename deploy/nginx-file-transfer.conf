# Include inside the CtrlCV TLS server block, replacing any existing file location.
# A /api/files/ prefix would implicitly redirect /api/files to /api/files/;
# Next.js redirects it back, preventing the client from loading the upload limit.
location ~ ^/api/files(?:/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
